name: CI/CD - Deploy to EC2

on:
  push:
    branches: [ "1.0" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Start ssh-agent and add key
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Ensure remote directory exists
      run: |
        ssh -o StrictHostKeyChecking=no -p ${{ secrets.EC2_PORT }} \
        ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "mkdir -p ${{ secrets.APP_DIR }}"

    - name: Rsync project to EC2 (excludes venv, .env, .git, media)
      run: |
        rsync -avz --delete \
          --exclude='.git' \
          --exclude='venv' \
          --exclude='.env' \
          --exclude='media' \
          --exclude='node_modules' \
          ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.APP_DIR }}/

    - name: Remote: install/update, migrate, collectstatic, restart
      run: |
        ssh -o StrictHostKeyChecking=no -p ${{ secrets.EC2_PORT }} \
        ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} 'bash -s' <<'REMOTE_CMDS'
          set -e
          cd ${{ secrets.APP_DIR }}

          if [ ! -d venv ]; then
            python3 -m venv venv
          fi

          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

          if [ ! -f .env ]; then
            echo ".env not found — aborting" >&2
            exit 1
          fi

          python manage.py migrate --noinput
          python manage.py collectstatic --noinput

          sudo systemctl restart horilla.service
        REMOTE_CMDS
