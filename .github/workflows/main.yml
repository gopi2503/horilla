name: CI/CD - Deploy to EC2

on:
  push:
    branches: [ "1.0" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Start ssh-agent and add key
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Ensure remote directory exists
      run: |
        ssh -o StrictHostKeyChecking=no -p ${{ secrets.EC2_PORT }} \
        ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "mkdir -p ${{ secrets.APP_DIR }}"

    - name: Rsync project to EC2
      run: |
        rsync -avz --delete \
          --exclude='.git' \
          --exclude='venv' \
          --exclude='.env' \
          --exclude='media' \
          --exclude='node_modules' \
          ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.APP_DIR }}/

    - name: Restart service on EC2
      run: |
        ssh -o StrictHostKeyChecking=no -p ${{ secrets.EC2_PORT }} \
        ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
        "cd ${{ secrets.APP_DIR }} && sudo systemctl restart horilla.service && sudo systemctl status horilla.service --no-pager"
