name: Deploy to EC2

on:
  push:
    branches:
      - 1.0   # change to 'main' if you want main branch deployment

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies & build
        run: |
          npm install
          npm run build || echo "No build step configured"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/horilla || git clone https://github.com/gopi2503/horilla.git
            cd horilla
            git pull origin main
            npm install
            pm2 restart horilla || pm2 start server.js --name horilla
            npm run build || echo "No build step"
            sudo cp -r build/* /var/www/html/ || echo "No frontend build to copy"
            sudo systemctl restart nginx
