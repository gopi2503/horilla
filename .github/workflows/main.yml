name: Deploy to EC2

on:
  push:
    branches:
      - 1.0 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: 
          npm install
          npm run build

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/horilla || git clone https://github.com/gopi2503/horilla.git
            cd horilla
            git pull origin main
            npm install
            pm2 restart all || pm2 start server.js --name horilla-backend
            npm run build
            sudo cp -r build/* /var/www/html/
            sudo systemctl restart nginx
